name: Release — distribuição manual
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-servicehub
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mvn -B -ntp clean verify
      - name: Persistência após reinício
        run: python scripts/check_persistence.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: python scripts/package.py
      - name: Criar release 1.1.0 validada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.1.0 dist/* --target "$GITHUB_SHA" --title "ServiceHub 1.1.0" --notes-file docs/RELEASE.md
