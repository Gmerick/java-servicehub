name: Release — distribuição manual
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-servicehub
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: mvn -B -ntp clean verify
      - name: Persistência após reinício
        run: python scripts/check_persistence.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: python scripts/package.py
      - name: Criar release da versao Maven validada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          gh release create "v$version" "dist/ServiceHub-$version.zip" dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "ServiceHub $version" --notes-file docs/RELEASE.md
