name: CI — validar e empacotar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Testes Java e JAR
        run: mvn -B -ntp clean verify
      - name: Validar sintaxe dos scripts EC2
        run: for script in deploy/aws/*.sh; do bash -n "$script"; done
      - name: Persistência após reinício
        run: python scripts/check_persistence.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fluxos de interface
        run: npm run test:ui
      - name: Gerar pacote
        run: python scripts/package.py
      - name: Checksum do JAR para EC2
        run: cd target && sha256sum app.jar > app.jar.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ServiceHub-EC2
          path: |
            target/app.jar
            target/app.jar.sha256
            deploy/aws/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ServiceHub-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: evidencias
          path: |
            target/surefire-reports/
            playwright-report/
            test-results/
            docs/screenshots/
          retention-days: 14
