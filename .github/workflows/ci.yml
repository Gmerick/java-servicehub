name: CI — validar e empacotar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Testes Java e JAR
        run: mvn -B -ntp clean verify
      - name: Persistência após reinício
        run: python scripts/check_persistence.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fluxos de interface
        run: npm run test:ui
      - name: Gerar pacote
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ServiceHub-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias
          path: |
            target/surefire-reports/
            playwright-report/
            test-results/
            docs/screenshots/
          retention-days: 14
